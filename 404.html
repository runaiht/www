<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">



 

 <script src="script.js" defer></script>
    <meta name="robots" content="noindex">
    <!-- Redirects to homepage after 3 seconds -->
    <meta http-equiv="refresh" content="1.3; url=/">
    <title>Page Not Found</title>
</head>
<body>
    <h1>Oops! Page Not Found.</h1>
    <p>The URL you requested does not exist. Redirecting you to the home page in 3 seconds...</p>
    <p>If you are not redirected, <a href="/">click here</a>.</p>

    <!-- JavaScript fallback if meta refresh fails -->
    <script>
        setTimeout(function() {
            window.location.href = "/";
        }, 3000);
    </script>
</body>
</html>
